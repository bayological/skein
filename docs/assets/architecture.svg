<svg xmlns="http://www.w3.org/2000/svg" width="800" height="584" viewBox="0 0 800 584" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#768390">
  <title id="t">skein architecture</title>
  <desc id="d">A coordinator in the repository checkout reads the plan and claims a task on the board. skein dispatch goes through the driver into three parallel workers, each in its own worktree and branch. Every worker runs the same gate, which the coordinator and CI also run. A cross-model review follows for money and pii tasks only, then skein merge squashes to the base branch.</desc>

  <text x="16" y="30" font-size="16" font-weight="600">skein: many agents in parallel, one gate</text>
  <text x="16" y="52" font-size="13">Each task runs in its own workspace on its own branch, and one gate decides what merges.</text>

