<svg xmlns="http://www.w3.org/2000/svg" width="800" height="734" viewBox="0 0 800 734" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How a task moves through skein</title>
  <desc>A vertical flow of seven steps, from the brief to the merge, with a dashed failure loop from both gate steps back to the worker.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#768390"/>
    </marker>
  </defs>

  <g fill="#768390">
    <text x="40" y="28" font-size="16" font-weight="600">How a task moves</text>

    <!-- 1. brief -->
    <rect x="40" y="48" width="420" height="58" rx="6" fill="none" stroke="#768390" stroke-width="1.5"/>
    <text x="58" y="73" font-size="16" font-weight="600">/skein-brief</text>
    <text x="442" y="73" font-size="14" text-anchor="end">coordinator, with you</text>
    <text x="58" y="93" font-size="14">the brief and the plan entry</text>

    <!-- 2. dispatch -->
    <rect x="40" y="146" width="420" height="58" rx="6" fill="none" stroke="#768390" stroke-width="1.5"/>
    <text x="58" y="171" font-size="16" font-weight="600">skein dispatch</text>
    <text x="442" y="171" font-size="14" text-anchor="end">coordinator</text>
    <text x="58" y="191" font-size="14">claim on the board, workspace, setup, worker launched</text>

    <!-- 3. watch -->
    <rect x="40" y="244" width="420" height="58" rx="6" fill="none" stroke="#768390" stroke-width="1.5"/>
    <text x="58" y="269" font-size="16" font-weight="600">skein watch</text>
    <text x="442" y="269" font-size="14" text-anchor="end">coordinator</text>
    <text x="58" y="289" font-size="14">polls for the worker's completion envelope</text>

    <!-- 4. gate, worker -->
    <rect x="40" y="356" width="420" height="58" rx="6" fill="none" stroke="#768390" stroke-width="2.5"/>
    <text x="58" y="381" font-size="16" font-weight="600">skein gate</text>
    <text x="442" y="381" font-size="14" text-anchor="end">worker</text>
    <text x="58" y="401" font-size="14">nine checks, before the worker claims done</text>

    <!-- 5. gate, coordinator -->
    <rect x="40" y="454" width="420" height="58" rx="6" fill="none" stroke="#768390" stroke-width="2.5"/>
    <text x="58" y="479" font-size="16" font-weight="600">skein gate</text>
    <text x="442" y="479" font-size="14" text-anchor="end">coordinator</text>
    <text x="58" y="499" font-size="14">the same nine checks, before the merge</text>

    <!-- 6. review -->
    <rect x="40" y="552" width="420" height="58" rx="6" fill="none" stroke="#768390" stroke-width="1.5"/>
    <text x="58" y="577" font-size="16" font-weight="600">skein review</text>
    <text x="442" y="577" font-size="14" text-anchor="end">coordinator</text>
    <text x="58" y="597" font-size="14">money/pii only: cross-model review of the pull request</text>

    <!-- 7. merge -->
    <rect x="40" y="650" width="420" height="58" rx="6" fill="none" stroke="#768390" stroke-width="1.5"/>
    <text x="58" y="675" font-size="16" font-weight="600">skein merge</text>
    <text x="442" y="675" font-size="14" text-anchor="end">coordinator</text>
    <text x="58" y="695" font-size="14">gate again, squash-merge, close the claim</text>

    <!-- the worker, where a failed gate sends the task back -->
    <rect x="510" y="396" width="270" height="76" rx="6" fill="none" stroke="#768390" stroke-width="1.5"/>
    <text x="528" y="422" font-size="16" font-weight="600">worker fixes</text>
    <text x="528" y="442" font-size="14">on its branch. The coordinator</text>
    <text x="528" y="462" font-size="14">sends fixes with skein send</text>

    <!-- the flow -->
    <g fill="none" stroke="#768390" stroke-width="1.5" marker-end="url(#ah)">
      <path d="M250 106 V146"/>
      <path d="M250 204 V244"/>
      <path d="M250 302 V356"/>
      <path d="M250 414 V454"/>
      <path d="M250 512 V552"/>
      <path d="M250 610 V650"/>
    </g>

    <!-- the failure loop -->
    <g fill="none" stroke="#768390" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)">
      <path d="M460 385 H485 V420 H510"/>
      <path d="M460 483 H485 V448 H510"/>
      <path d="M645 396 V330 H400 V356"/>
    </g>
    <text x="522" y="322" font-size="14" text-anchor="middle">gate fails: worker fixes, gate again</text>
  </g>
</svg>
